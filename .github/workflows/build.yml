name: Build

on:
  push:
    branches: ["main"]
    tags: ["1.0.0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/scrub.exe .
          Compress-Archive -Path dist/scrub.exe -DestinationPath dist/scrub-windows-amd64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrub-windows-amd64
          path: |
            dist/scrub.exe
            dist/scrub-windows-amd64.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref_name == '1.0.0'
        uses: softprops/action-gh-release@v2
        with:
          name: Scrub ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/scrub.exe
            dist/scrub-windows-amd64.zip
